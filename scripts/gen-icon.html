<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; }
  svg { display: block; }
</style>
</head>
<body>
<svg id="icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <rect width="100" height="100" fill="#124238" />
  <polygon id="star" fill="#c9a25e" />
</svg>
<script>
  function starPoints(cx, cy, spikes, outerR, innerR) {
    const step = Math.PI / spikes
    let rotation = -Math.PI / 2
    const points = []
    for (let i = 0; i < spikes; i++) {
      points.push((cx + Math.cos(rotation) * outerR).toFixed(2) + ',' + (cy + Math.sin(rotation) * outerR).toFixed(2))
      rotation += step
      points.push((cx + Math.cos(rotation) * innerR).toFixed(2) + ',' + (cy + Math.sin(rotation) * innerR).toFixed(2))
      rotation += step
    }
    return points.join(' ')
  }
  const params = new URLSearchParams(location.search)
  const outerR = Number(params.get('outerR') || 32)
  const innerR = Number(params.get('innerR') || 14)
  document.getElementById('star').setAttribute('points', starPoints(50, 50, 8, outerR, innerR))
</script>
</body>
</html>
